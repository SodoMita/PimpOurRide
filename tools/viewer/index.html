<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChromeDrive — Native compositor</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b12;color:#e8edf6;font-family:system-ui,-apple-system,sans-serif}body{display:flex;flex-direction:column}header{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;border-bottom:1px solid #202734;background:#0b1019}.brand{display:flex;align-items:center;gap:13px}.mark{width:30px;height:30px;display:grid;place-items:center;border:1px solid #ae86ea;border-radius:8px;color:#c49cf8;font-size:19px}.name{font-size:13px;font-weight:750;letter-spacing:.09em}.meta{font:10px ui-monospace,monospace;color:#7d8c9f;margin-top:3px;letter-spacing:.03em}.status{color:#71dcbc;display:flex;align-items:center;gap:6px;font:10px ui-monospace,monospace}.status:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.actions{display:flex;align-items:center;gap:5px}button{font:11px system-ui,sans-serif;cursor:pointer;color:#a8b6c8;background:#121a26;border:1px solid #263143;padding:8px 11px;border-radius:6px;transition:.15s}button:hover{color:#f0e9ff;border-color:#9e78d3;background:#29213d}button:focus-visible{outline:2px solid #a885e1;outline-offset:2px}.key{color:#648080;font-size:9px;margin-left:6px}#screen{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}#screen>div{width:100%;height:100%}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#98a8bd;font-size:14px;line-height:1.8}.loading small{color:#62758a}footer{height:33px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;border-top:1px solid #1b2533;color:#7f8fa4;font:10px ui-monospace,monospace;background:#0b1019}footer b{font-weight:500;color:#a9b9ce}.mobile{display:none}@media(max-width:850px){header{height:56px;padding:0 12px}.actions button{padding:7px 8px}.key,.meta,.status{display:none}footer{font-size:9px;padding:0 10px}.extra{display:none}}@media(max-width:550px){.name{font-size:11px}.actions button{font-size:10px;padding:6px}.extra-button{display:none}.mobile{display:inline}}
</style></head><body><header><div class="brand"><div class="mark">›</div><div><div class="name">CHROMEDRIVE</div><div class="meta">LIVE NATIVE WAYLAND COMPOSITOR</div></div></div><div class="status" id="status">CONNECTING</div><nav class="actions" aria-label="Native compositor controls"><button data-key="65471" title="Restore the first-person driver view">Driver view<span class="key">F2</span></button><button data-key="65472" title="Magnify the selected app screen">Focus<span class="key">F3</span></button><button data-key="65473" title="Change cockpit underglow">Neon<span class="key">F4</span></button><button data-key="65475" class="extra-button" title="Turn to the next app monitor">Next app<span class="key">F6</span></button><button data-key="65470" title="Open the native controls guide">Help<span class="key">F1</span></button></nav></header><main id="screen" aria-label="Live remote view of the native OpenGL compositor"><div class="loading" id="loading">Connecting to the driver's seat…<br><small>Streaming the actual Linux process, not a web mockup.</small></div></main><footer><span><b>Middle-drag</b> to look · <b>Click an app</b> to type · <b>Shift + dashboard button</b> for a new instance</span><span class="extra">OpenGL + libwayland-server · CPU-rendered sandbox preview</span></footer>
<script type="module">
import RFB from './core/rfb.js';
const status=document.getElementById('status'), loading=document.getElementById('loading');
const protocol=location.protocol==='https:'?'wss':'ws';
const rfb=new RFB(document.getElementById('screen'),`${protocol}://${location.host}/websockify`);
rfb.scaleViewport=true;rfb.resizeSession=false;rfb.background='#070b12';rfb.showDotCursor=true;rfb.focusOnClick=true;rfb.qualityLevel=8;rfb.compressionLevel=2;
rfb.addEventListener('connect',()=>{status.textContent='NATIVE SESSION';loading.remove();rfb.focus();});
rfb.addEventListener('disconnect',e=>{status.textContent='DISCONNECTED';status.style.color='#ed9e9e';const note=document.createElement('div');note.className='loading';note.textContent='The native session disconnected. Reload to reconnect.';document.getElementById('screen').append(note);});
rfb.addEventListener('credentialsrequired',()=>{status.textContent='CREDENTIALS REQUIRED';});
document.querySelectorAll('[data-key]').forEach(button=>button.addEventListener('click',()=>{const k=Number(button.dataset.key);rfb.sendKey(k,null,true);rfb.sendKey(k,null,false);rfb.focus();}));
document.getElementById('screen').addEventListener('contextmenu',e=>e.preventDefault());
window.chromedriveRemote=rfb;
</script></body></html>
